<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d121c">
<title>Cloud3DS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%233b9cff'/%3E%3Cstop offset='1' stop-color='%237a5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg fill='url(%23g)'%3E%3Ccircle cx='15.9' cy='26.6' r='9.2'/%3E%3Ccircle cx='35.1' cy='29.1' r='7.1'/%3E%3Ccircle cx='25.9' cy='22' r='11.7'/%3E%3Crect x='6.3' y='26.6' width='35.5' height='9.6' rx='4.8'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f5fa;--card:#fff;--card2:#e9eef5;--line:#dbe2ec;--text:#161c2a;--muted:#667085;
  --a:#3b9cff;--b:#7a5cff;--ok:#20b26c;--warn:#e9a21f;--err:#e5484d;--shadow:0 6px 24px rgba(16,32,64,.08);
  --grad:linear-gradient(120deg,var(--a),var(--b));--r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d121c;--card:#161e2b;--card2:#1f2837;--line:#283244;--text:#ecf0f7;--muted:#8b96ab;--shadow:0 6px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}
.muted{color:var(--muted)}

/* ---------- acceso ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.lcard{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:32px 26px 26px;box-shadow:var(--shadow);text-align:center}
.logo{width:76px;height:76px;display:grid;place-items:center;margin:0 auto 10px;position:relative}
.logo::before{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,rgba(91,110,255,.35),transparent 70%);filter:blur(8px)}
.logo svg.cloud{width:100%;height:100%;stroke:none;position:relative}
.lcard h1{margin:0;font-size:24px;letter-spacing:-.2px}
.lcard .sub{margin:4px 0 22px;color:var(--muted)}
.pin{display:flex;gap:10px;justify-content:center;margin:8px 0 6px}
.pin input{width:54px;height:62px;border-radius:14px;border:2px solid var(--line);background:var(--card2);text-align:center;font-size:28px;font-weight:600;outline:none;transition:border-color .15s,transform .15s}
.pin input:focus{border-color:var(--a)}
.pin.bad input{border-color:var(--err);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lmsg{min-height:40px;margin-top:12px;font-size:14px;color:var(--muted)}
.lmsg.err{color:var(--err)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--card2);border-top-color:var(--a);animation:rot .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes rot{to{transform:rotate(360deg)}}
.kick{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.kick svg{width:28px;height:28px}
#lkick b{display:block;font-size:20px;margin-bottom:6px}
#lkick p{margin:0 0 18px;color:var(--muted);font-size:14.5px}
.hint{margin-top:18px;font-size:13px;color:var(--muted);line-height:1.5}

/* ---------- app ---------- */
#app{max-width:1000px;margin:0 auto;padding:0 16px 120px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -16px;padding:12px 16px 10px}
.top{display:flex;align-items:center;gap:12px}
.top .logo{width:40px;height:40px;margin:0}
.top .logo::before{inset:8px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;line-height:1.2}
.brand span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text);transition:background .15s}
.ibtn:hover,.ibtn.on{background:var(--card2)}
.space{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:3px;transition:width .3s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:14px;transition:all .15s}
.chip svg{width:17px;height:17px;color:var(--a)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.chip.on svg{color:#fff}
.banner{margin-top:12px;padding:9px 14px;border-radius:12px;font-size:13.5px;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.banner svg{width:18px;height:18px}
.banner.warn{border-left:3px solid var(--warn)}
.banner.warn svg{color:var(--warn)}
.banner .grow{flex:1}
.banner .btn{flex:none;padding:6px 12px}
.row .rst{flex:none;padding:6px 12px}
.banner.err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}

.bar2{display:flex;align-items:center;gap:8px;margin:14px 0 10px;position:relative;padding-right:48px}
.sq{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--text);flex:none;transition:all .15s}
.sq:hover{border-color:var(--a)}
.sq:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.sq svg{width:19px;height:19px}
.crumbs{flex:1;min-width:0;height:40px;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 6px}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{padding:6px 8px;border-radius:8px;color:var(--muted)}
.crumbs button:last-child{color:var(--text);font-weight:600}
.crumbs button:hover{background:var(--card2)}
.crumbs .sep{color:var(--line);font-size:13px}
/* búsqueda: una lupa que se despliega hacia la izquierda y tapa la fila con su propio fondo */
.search{position:absolute;right:0;top:0;height:40px;width:40px;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:3;transition:width .28s cubic-bezier(.2,.9,.3,1),box-shadow .2s,border-color .2s}
.search .lens{width:38px;height:38px;display:grid;place-items:center;flex:none;color:var(--text)}
.search .lens svg{width:19px;height:19px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;opacity:0;transition:opacity .2s;font-size:15px}
.search .x{width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--muted);opacity:0;pointer-events:none;transition:opacity .2s}
.search .x svg{width:17px;height:17px}
.search.open{width:100%;border-color:var(--a);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.search.open .lens{color:var(--a)}
.search.open input,.search.open .x{opacity:1;pointer-events:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14.5px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--a)}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(91,110,255,.3)}
.btn.danger{color:var(--err)}
.btn svg{width:18px;height:18px}
.btn .lbl{display:inline}
.grow{flex:1}

.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;user-select:none}
.row:last-child{border-bottom:0}
.mk1{--mk:#ef4444}.mk2{--mk:#f97316}.mk3{--mk:#eab308}.mk4{--mk:#22c55e}.mk5{--mk:#3b82f6}.mk6{--mk:#a855f7}
.row[class*="mk"]{box-shadow:inset 4px 0 0 var(--mk)}
.row[class*="mk"] .ic,.tile[class*="mk"] .th.folder{background:color-mix(in srgb,var(--mk) 20%,transparent);color:var(--mk)}
.row[class*="mk"] .meta b{color:var(--mk)}
.tile[class*="mk"]{box-shadow:inset 0 4px 0 var(--mk),var(--shadow)}
.tile[class*="mk"] .th.folder svg{color:var(--mk)}
.grp{display:flex;align-items:center;gap:8px;width:100%;padding:16px 6px 8px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;user-select:none}
.grp svg{width:16px;height:16px;transition:transform .2s}.grp.open svg{transform:rotate(90deg)}
.grp span{margin-left:auto;font-weight:500}
.marks{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap}
.marks>svg{width:22px;height:22px;flex:none;color:var(--muted)}.marks b{font-weight:500;margin-right:auto}
.swt{width:26px;height:26px;border-radius:50%;background:var(--mk,transparent);border:2px solid var(--line);display:grid;place-items:center;padding:0}
.swt.on{outline:2px solid var(--text);outline-offset:2px}.swt.mk0{background:var(--card2)}.swt.mk0::after{content:"";width:14px;height:2px;background:var(--muted);transform:rotate(-45deg)}
.row:hover{background:var(--card2)}
.row.sel{background:color-mix(in srgb,var(--a) 12%,var(--card))}
.ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;overflow:hidden}
.ic svg{width:21px;height:21px}
.ic img{width:100%;height:100%;object-fit:cover}
.ic.folder{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.ic.img{background:color-mix(in srgb,var(--b) 16%,transparent);color:var(--b)}
.ic.app{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.ic.file{background:var(--card2);color:var(--muted)}
.ic.vid{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.ic.txt{background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a)}
.ic.sav{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.ic.zip{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.ic.rom{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .12s}
.chk svg{width:14px;height:14px;stroke-width:3;color:#fff;opacity:0}
.row.sel .chk{background:var(--a);border-color:var(--a)}
.row.sel .chk svg{opacity:1}
.more{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.more:hover{background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;position:relative;user-select:none}
.tile .th{aspect-ratio:4/3;display:grid;place-items:center;background:var(--card2);position:relative}
.tile .lockb{right:8px;bottom:8px;width:22px;height:22px}
.tile .lockb svg{width:13px;height:13px}
.tile .th img{width:100%;height:100%;object-fit:cover}
.tile .th svg{width:34px;height:34px;color:var(--muted)}
.tile .th.folder svg{color:var(--warn)}
.tile .nm{padding:8px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.sel{outline:3px solid var(--a)}

.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 10px}
.fchips .chip{padding:6px 11px;font-size:13px}
.fchips .chip span{opacity:.7}
.findall{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px dashed var(--line);color:var(--a);font-size:14px;text-align:left}
.findall svg{width:18px;height:18px}
.row .meta span .where{display:inline;color:var(--a)}
.row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--a) 22%,var(--card))}}
.dlg.hash{max-width:560px}
.dlg.hash .hn{margin:-4px 0 10px;color:var(--muted);word-break:break-all}
.hv{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.hv span{width:64px;flex:none;font-size:12.5px;color:var(--muted)}
.hv code{flex:1;font-size:13px;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
.hv .btn{flex:none;padding:6px 8px}
.hv .btn svg{width:16px;height:16px}
.hchk{margin-top:10px;padding:8px 12px;border-radius:10px;font-size:13.5px}
.hchk.ok{background:color-mix(in srgb,var(--ok,#2ec47a) 16%,transparent);color:var(--ok,#2ec47a)}
.hchk.bad{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.dlg.hash .field{margin-top:12px}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--a)}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .big{width:64px;height:64px;border-radius:20px;background:var(--card2);display:grid;place-items:center;margin:0 auto 14px}
.empty .big svg{width:30px;height:30px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.loading{padding:40px;text-align:center}

.foot{margin:30px 0 0;text-align:center;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px;align-items:center}
.foot a{color:var(--muted)}
.social{display:flex;gap:10px;margin-bottom:6px}
.social a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:all .15s}
.social a svg{width:19px;height:19px;fill:currentColor;stroke:none}
.social a:hover{transform:translateY(-2px)}
.social .gh{color:var(--text)}.social .dc{color:#5865f2}.social .kf{color:#ff5e5b}

/* barra de selección */
.selbar{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);background:var(--text);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,.9,.3,1.2);z-index:40;max-width:calc(100vw - 24px)}
.selbar.show{transform:translate(-50%,0)}
.selbar span{font-weight:600;margin-right:6px;white-space:nowrap}
.selbar button{height:38px;padding:0 12px;border-radius:11px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.selbar button:hover{background:rgba(127,127,127,.25)}
.selbar svg{width:18px;height:18px}

/* botón flotante (móvil) */
.fab{position:fixed;right:18px;bottom:22px;height:56px;padding:0 22px 0 18px;border-radius:18px;background:var(--grad);color:#fff;display:none;align-items:center;gap:8px;font-weight:600;box-shadow:0 10px 26px rgba(91,110,255,.45);z-index:30;transition:transform .2s}
.fab svg{width:22px;height:22px}
.fab.away{transform:translateY(160%)}

/* cola de subidas */
.queue{position:fixed;right:20px;bottom:20px;width:360px;max-width:calc(100vw - 24px);background:var(--card);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.28);z-index:45;overflow:hidden;transform:translateY(130%);transition:transform .3s cubic-bezier(.2,.9,.3,1.1)}
.queue.show{transform:none}
.qh{display:flex;align-items:center;gap:10px;padding:14px 12px 12px 16px;cursor:pointer}
.qh b{flex:1;font-size:15px}
.qh .muted{font-size:12.5px}
.qsum{padding:0 16px 12px}
.qlist{max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.queue.min .qlist{display:none}
#insq{z-index:46}
#dlq{z-index:44;right:auto;left:20px}
#shotc{z-index:47;width:380px}
.mup{position:fixed;left:50%;bottom:20px;transform:translate(-50%,160%);transition:transform .3s cubic-bezier(.2,.9,.3,1.1);z-index:43;display:flex;align-items:center;gap:6px;padding:8px 10px 8px 14px;border-radius:999px;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 24px)}
.mup.show{transform:translate(-50%,0)}
.mup .mt{display:flex;flex-direction:column;min-width:0;max-width:240px;margin-right:4px}
.mup .mt b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mup .mt span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mup button{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;color:var(--text)}
.mup button svg{width:18px;height:18px}
.mup button.pp{background:var(--a);color:#fff}
#shotc .shimg{display:block;width:100%;background:#000}
#shotc .shimg canvas,#shotc .shimg img{display:block;width:100%;height:auto}
#shotc .sha{display:flex;gap:8px;align-items:center;padding:10px 12px}
#shotc .sha label{flex:1;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.vtop .livep{font-size:12.5px;color:var(--ok);white-space:nowrap}
.vtop .livep::before{content:"";display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--ok);margin-right:6px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.vtop .btn.on{background:var(--ok);color:#fff;border-color:transparent}
.dlf label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.dlf textarea.field{min-height:74px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.dlf .chk2{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.dlf .chk2 input{width:18px;height:18px;accent-color:var(--a)}
.qi{display:flex;gap:10px;align-items:center;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.qi:last-child{border-bottom:0}
.qi .meta span.err{color:var(--err)}
.qi .meta span.ok{color:var(--ok)}
.pbar{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;width:0;background:var(--grad);transition:width .25s}

/* hojas, diálogos y visor */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:50;opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center}
.scrim.show{opacity:1}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:22px 22px 0 0;padding:8px 10px calc(14px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.9,.3,1)}
.scrim.show .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh{display:flex;gap:12px;align-items:center;padding:4px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sh .meta b{white-space:normal;word-break:break-word}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:12px;text-align:left;font-size:15.5px}
.act:hover{background:var(--card2)}
.sheet .dv{height:1px;background:var(--line,rgba(127,127,127,.18));margin:6px 12px}
.act svg{color:var(--muted)}
.act.danger,.act.danger svg{color:var(--err)}
.act.off{cursor:default;align-items:flex-start}
.act.off:hover{background:none}
.act.off svg{color:var(--warn);margin-top:2px}
.act.off b{display:block;font-weight:500}
.act.off small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ic{position:relative}
.lockb{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--warn)}
.lockb svg{width:11px;height:11px;stroke-width:2.6}
@media (min-width:700px){
  .scrim{align-items:center}
  .sheet{border-radius:22px;padding-bottom:14px;transform:scale(.96)}
}
.dlg{width:calc(100% - 32px);max-width:400px;background:var(--card);border-radius:22px;padding:22px 20px 16px;margin:auto;transform:scale(.95);transition:transform .2s}
.scrim.center{align-items:center}
.scrim.show .dlg{transform:none}
.dlg h3{margin:0 0 8px;font-size:18px}
.dlg p{margin:0 0 16px;color:var(--muted);font-size:14.5px;word-break:break-word}
.dlg .field{width:100%;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card2);padding:0 12px;outline:0;margin-bottom:16px;font-size:16px}
.dlg .field:focus{border-color:var(--a)}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg .btns.col{flex-direction:column;align-items:stretch}
.dlg .btns .btn{height:42px}
.dlg.pick{max-width:460px;display:flex;flex-direction:column;max-height:calc(100vh - 60px)}
.dlg.pick .pc{margin:0 0 8px;overflow-x:auto;white-space:nowrap;display:flex;gap:4px;align-items:center;font-size:14px}
.dlg.pick .pc button{padding:4px 6px;border-radius:8px}.dlg.pick .pc .sep{color:var(--muted)}
.dlg.pick .plist{flex:1;min-height:180px;max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;padding:4px}
.prow{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;text-align:left;font-size:15px}
.prow:hover{background:var(--card2)}.prow svg{width:20px;height:20px;color:var(--warn,#e8a33a);flex:none}
.pempty{text-align:center;color:var(--muted);padding:30px 10px;margin:0}
.dlg .btns .grow{flex:1}
.dlg .btns.col{flex-direction:column}
.dlg .btns.col .btn{width:100%;justify-content:center}
.dlg .btn.dng{background:var(--err);color:#fff;border-color:transparent}
.dlg label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:-6px 0 14px}

.viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;opacity:0;transition:opacity .2s}
.viewer.show{opacity:1}
.vtop{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;background:linear-gradient(#000a,#0000);position:absolute;left:0;right:0;top:0;z-index:2}
.vtop b{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtop .ibtn{color:#fff}
.vtop .ibtn:hover{background:#ffffff22}
.vbody{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.vbody img,.vbody video{max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto}
.vbody .ved{color:#e8e8e8;background:#111;margin:60px 12px 12px;padding:14px;border-radius:12px;max-width:900px;width:100%;height:calc(100% - 72px);border:1px solid #333;resize:none;outline:none;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.vtop .btn.dim{opacity:.45;pointer-events:none}
.vbody pre{color:#e8e8e8;background:#111;margin:60px 12px 12px;padding:14px;border-radius:12px;max-width:900px;width:100%;max-height:calc(100% - 72px);overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:#ffffff22;color:#fff;display:grid;place-items:center}
.vnav.l{left:12px}.vnav.r{right:12px}
.vcount{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fffc;font-size:13px;background:#0008;padding:4px 10px;border-radius:99px}

.drop{position:fixed;inset:12px;border:3px dashed var(--a);border-radius:24px;background:color-mix(in srgb,var(--a) 10%,var(--bg));z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:18px;font-weight:600;pointer-events:none}
.drop.show{display:flex}
.drop svg{width:48px;height:48px;color:var(--a)}
.drop span{font-size:14px;font-weight:400;color:var(--muted)}

.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-160%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:80;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .25s;max-width:calc(100vw - 24px)}
.toast.show{transform:translate(-50%,0)}
.offline{position:fixed;left:0;right:0;top:0;z-index:90;background:var(--err);color:#fff;text-align:center;padding:8px 12px;font-size:13.5px;transform:translateY(-100%);transition:transform .25s}
.offline.show{transform:none}

/* ocultos de verdad cuando no se muestran: si no, asoma la sombra */
.toast,.selbar,.queue,.offline{visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1.1),visibility 0s linear .28s}
.toast.show,.selbar.show,.queue.show,.offline.show{visibility:visible;transition:transform .28s cubic-bezier(.2,.9,.3,1.1),visibility 0s}

@media (max-width:699px){
  .btn .lbl{display:none}
  .btn{padding:0 11px}
  .tools .btn.up{display:none}
  .fab{display:flex}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .queue{right:12px;left:12px;bottom:12px;width:auto;max-width:none}
  #dlq{right:12px;left:12px}
  .mup{bottom:84px}
  .selbar span.n{display:none}
}
</style>
</head>

 if(dd===td)return t("today")+" "+hm; if(dd===td-1)return t("yest")+" "+hm;

class ApiErr extends Error{constructor(code,status,j){super(code);this.code=code;this.status=status;this.j=j||{}}}
async function api(method,ep,params={},body){
 const q=new URLSearchParams(params).toString();
 let r;
 try{r=await fetch("/api/"+ep+(q?"?"+q:""),{method,body,credentials:"same-origin",headers:body&&typeof body==="string"?{"Content-Type":"application/x-www-form-urlencoded"}:undefined})}
 catch(e){setOffline(true);throw new ApiErr("net",0)}
 setOffline(false);
 let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&ep!=="login"){showLogin(false,j.error==="revoked");throw new ApiErr("auth",401)}
 if(!r.ok)throw new ApiErr(j.error||String(r.status),r.status,j);
 return j;
}
function errText(e){const k="err_"+(e.code||"");return TX[k]||L.es[k]?t(k):t("err",e.code||e.message)}
function setOffline(on){const o=$("#offline");o.textContent=t("offline");o.classList.toggle("show",on)}

let hello={};
async function boot(){
 try{hello=await (await fetch("/api/hello")).json()}catch(e){hello={}}
 const k=(location.hash.match(/k=([0-9a-f]+)/)||[])[1];
 if(k)history.replaceState(null,"",location.pathname);
 if(hello.authed){startApp();return}
 if(hello.revoked&&!k){showLogin(false,true);return}
 if(k){
  showLogin(true);
  try{await api("POST","login",{}, "k="+k);startApp();return}
  catch(e){showLogin();msg(e.code==="net"?t("noConsole"):e.code==="locked"?t("locked"):t("qrOld"),true);return}
 }
 showLogin();
}

function clearPin(){document.querySelectorAll("#pin input").forEach(x=>x.value="");$("#pin").classList.remove("bad")}
function showLogin(connecting,kicked){
 clearPin();
 const wasApp=!$("#app").classList.contains("hide");
 $("#app").classList.add("hide");$("#fab").classList.add("hide");$("#login").classList.remove("hide");
 clearInterval(window._ping);
 // expulsado desde la consola: se explica en vez de volver al PIN sin más
 if(kicked===undefined)kicked=false;
 $("#lkick").classList.toggle("hide",!kicked);
 $("#lkick").innerHTML=kicked?`<div class="kick">${svg("out")}</div><b>${t("kickedT")}</b><p>${t("kickedD")}</p>`:"";
 $(".lcard .logo").classList.toggle("hide",kicked);$(".lcard h1").classList.toggle("hide",kicked);
 if(kicked&&wasApp)Q.items.filter(i=>i.state==="run").forEach(i=>i.xhr&&i.xhr.abort());
 $("#lsub").textContent=hello.console||"Nintendo 3DS";
 $("#lpin").classList.toggle("hide",!!connecting);
 $("#lhint").textContent=connecting?"":t("hint");
 if(connecting)msg('<span class="spin"></span>&nbsp; '+t("conn"));else{msg(t("pinAsk"));setTimeout(()=>$("#pin input").focus(),50)}
}
(function pinBoxes(){
 const ins=[...document.querySelectorAll("#pin input")];
 ins.forEach((el,i)=>{
  el.addEventListener("input",()=>{
   const v=el.value.replace(/\D/g,"");
   if(v.length>1){v.split("").slice(0,4-i).forEach((c,j)=>ins[i+j].value=c);ins[Math.min(3,i+v.length-1)].focus()}
   else{el.value=v;if(v&&i<3)ins[i+1].focus()}
   const pin=ins.map(x=>x.value).join("");
   if(pin.length===4)tryPin(pin);
  });
  el.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!el.value&&i>0){ins[i-1].focus();ins[i-1].value=""}});
 });
})();
async function tryPin(pin){
 const box=$("#pin");msg('<span class="spin"></span>');
 try{await api("POST","login",{}, "pin="+pin);clearPin();startApp()}
 catch(e){
  box.classList.remove("bad");void box.offsetWidth;box.classList.add("bad");
  document.querySelectorAll("#pin input").forEach(x=>x.value="");$("#pin input").focus();
  msg(e.code==="locked"?t("locked"):e.code==="net"?t("noConsole"):t("badPin"),true);
 }
}

 const col=new Intl.Collator(lang,{numeric:true,sensitivity:"base"});
 a.sort((x,y)=>{

 return new Promise(res=>{
  const m=modal(`<div class="dlg"><h3>${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:""}
   <div class="btns col">${opts.map(([k,l,c])=>`<button class="btn ${c}" data-r="${esc(k)}">${esc(l)}</button>`).join("")}</div></div>`,true);

  const obs=new MutationObserver(()=>{if(!document.body.contains(m.el)){obs.disconnect();if(!done)res(null)}});obs.observe(document.body,{childList:true});
 });

const Q={items:[],running:false,min:false,policy:null,doneCount:0};
function enqueue(files,dest){
 if(S.info.readonly){toast(t("err_readonly"));return}
 for(const f of files){
  const rel=f._rel||f.webkitRelativePath||f.name;
  if(!rel)continue;
  Q.items.push({file:f,path:dest==="/"?"/"+rel:dest+"/"+rel,name:base(rel),state:"queued",done:0,speed:0,deep:rel.includes("/")});
 }
 Q.policy=null;
 renderQueue();
 if(!Q.running)runQueue();
}
async function runQueue(){
 Q.running=true;
 const first=Q.items.findIndex(i=>i.state==="queued");
 let forceSys=null;
 for(const it of Q.items){
  if(it.state!=="queued")continue;
  const dir=parent(it.path);
  if(S.info.protect&&isSys(dir)&&dir!=="/"){
   if(forceSys===null){const ok=await ask({title:t("sysQ"),text:t("sysD",dir),ok:t("cont"),danger:true});forceSys=!!ok}
   if(!forceSys){it.state="skipped";renderQueue();continue}
  }
  await uploadOne(it,{force:forceSys?1:0,ow:0});
  renderQueue();
 }
 Q.running=false;
 renderQueue();
 go(S.path,true);refreshInfo();
 // si se subieron ZIP, se ofrece descomprimirlos en la consola
 const zips=Q.items.slice(Math.max(first,0)).filter(i=>i.state==="done"&&/\.zip$/i.test(i.name)).map(i=>i.path);
 if(zips.length&&!S.info.readonly)unzipAsk(zips,true);
 // si se subieron CIA, la web ofrece instalarlos (la consola confirma igualmente)
 const cias=Q.items.slice(Math.max(first,0)).filter(i=>i.state==="done"&&/\.cia$/i.test(i.name)).map(i=>i.path);
 if(cias.length&&!S.info.readonly){
  // instalar, dejarlos copiados o cancelar la copia (se borran de la SD)
  const r=await choose({title:t("insAskT"),text:t("insAskD",cias.length),
   opts:[["install",t("insOk"),"pri"],["keep",t("insKeep"),""],["cancel",t("insCancel"),"dng"]]});
  if(r==="install"){if(!Q.items.some(i=>i.state==="run"||i.state==="queued")){Q.items=[];renderQueue()}requestInstall(cias,true)}
  if(r==="cancel"){
   let ok=0;for(const p of cias){try{await api("POST","delete",{p,now:1});ok++}catch(e){toast(base(p)+": "+errText(e))}}
   if(ok)toast(t("insCanceled"));go(S.path,true);refreshInfo();
  }
 }
}
function uploadOne(it,opt){
 return new Promise(resolve=>{
  const x=new XMLHttpRequest();it.xhr=x;it.state="run";it.t0=performance.now();it.lt=it.t0;it.ld=0;
  const q=new URLSearchParams({p:it.path});if(opt.ow)q.set("ow","1");if(opt.force)q.set("force","1");if(it.deep)q.set("mk","1");
  x.open("PUT","/api/upload?"+q);
  x.upload.onprogress=e=>{const now=performance.now();it.done=e.loaded;const dt=(now-it.lt)/1000;
   if(dt>.5){const inst=(e.loaded-it.ld)/dt;it.speed=it.speed?it.speed*.6+inst*.4:inst;it.lt=now;it.ld=e.loaded}renderQueueSoon()};
  x.onload=async()=>{
   let j={};try{j=JSON.parse(x.responseText)}catch(e){}
   if(x.status===200){it.state="done";it.done=it.file.size;Q.doneCount++;resolve();return}
   if(x.status===409&&j.error==="exists"){
    let r=Q.policy?{act:Q.policy}:await conflict(it.name,false);
    if(r.all)Q.policy=r.act;
    if(r.act==="replace"){resolve(await uploadOne(it,{...opt,ow:1}));return}
    if(r.act==="keep"){it.path=freeName(it.path);it.name=base(it.path);resolve(await uploadOne(it,opt));return}
    if(r.act==="rename"){it.path=join(parent(it.path),r.name);it.name=r.name;resolve(await uploadOne(it,opt));return}
    if(r.act==="cancel"){Q.items.forEach(i=>{if(i.state==="queued")i.state="canceled"});it.state="canceled";resolve();return}
    it.state="skipped";resolve();return;
   }
   if(x.status===401){showLogin();}
   it.state="error";it.err=errText({code:j.error||String(x.status)});resolve();
  };
  x.onerror=()=>{it.state="error";it.err=t("err_net");setOffline(true);resolve()};
  x.onabort=()=>{it.state="canceled";resolve()};
  x.send(it.file);
  renderQueue();
 });
}
function freeName(p,peek){
 const d=parent(p),n=base(p),i=n.lastIndexOf("."),b=i>0?n.slice(0,i):n,e=i>0?n.slice(i):"";
 const names=new Set(S.items.map(x=>x.n.toLowerCase()));let k=2,c;
 do{c=`${b} (${k++})${e}`}while(names.has(c.toLowerCase())&&k<999);
 if(!peek)S.items.push({n:c});
 return join(d,c);
}

   <div class="btns col"><button class="btn pri" data-c="replace">${dir?t("merge"):t("replace")}</button><button class="btn" data-c="rename">${t("renameAs")}</button><button class="btn" data-c="keep">${t("keep")}</button><button class="btn" data-c="skip">${t("skip")}</button><button class="btn dng" data-c="cancel">${t("cancelAll")}</button></div></div>`,true);
  let done=false;
  m.el.addEventListener("click",async e=>{const c=e.target.closest("[data-c]");if(!c)return;done=true;const all=m.el.querySelector("#cAll").checked;m.close();

let rqT=0;
function renderQueueSoon(){if(!rqT)rqT=setTimeout(()=>{rqT=0;renderQueue()},250)}
function renderQueue(){

 if(!items.length){el.classList.remove("show");return}

 const total=items.reduce((a,i)=>a+(i.state==="skipped"||i.state==="canceled"?0:i.file.size),0);

 const idx=items.filter(i=>i.state!=="queued").length;
 const head=active.length?t("uploading",Math.min(idx,items.length),items.length):t("uploadsDone");
 const sub=active.length&&speed?`${fsize(speed)}/s · ${t("left",feta((total-done)/speed))}`:active.length?"":t("upDone",Q.doneCount);
 const row=i=>{
  const st=i.state==="run"?`${fsize(i.done)} / ${fsize(i.file.size)}`:i.state==="queued"?t("queued")+" · "+fsize(i.file.size):
   i.state==="done"?`<span class="ok">${t("done")}</span>`:i.state==="error"?`<span class="err">${esc(i.err||t("failed"))}</span>`:i.state==="skipped"?t("skipped"):t("canceled");
  const pct=i.state==="done"?100:i.file.size?i.done/i.file.size*100:0;
  return `<div class="qi"><div class="ic ${kind({n:i.name})}">${svg(kind({n:i.name})==="img"?"img":"file")}</div><div class="meta"><b>${esc(i.name)}</b><span>${st}</span>${i.state==="run"?`<div class="pbar"><i style="width:${pct.toFixed(1)}%"></i></div>`:""}</div>
   ${i.state==="run"||i.state==="queued"?`<button class="more" data-qx="${items.indexOf(i)}">${svg("x")}</button>`:""}</div>`;
 };
 el.innerHTML=`<div class="qh" id="qh"><div class="meta"><b>${head}</b><span class="muted">${sub}</span></div>
  ${active.length?"":`<button class="more" data-qclose="1">${svg("x")}</button>`}</div>
  <div class="qsum"><div class="pbar"><i style="width:${total?(done/total*100).toFixed(1):100}%"></i></div></div>
  <div class="qlist">${items.slice().reverse().map(row).join("")}</div>`;
}
$("#queue").addEventListener("click",e=>{
 const x=e.target.closest("[data-qx]");
 if(x){e.stopPropagation();const it=Q.items[+x.dataset.qx];if(it.state==="run")it.xhr.abort();else it.state="canceled";renderQueue();return}
 if(e.target.closest("[data-qclose]")){e.stopPropagation();Q.items=[];Q.doneCount=0;renderQueue();return}
 if(e.target.closest("#qh")){Q.min=!Q.min;renderQueue()}
});
window.addEventListener("beforeunload",e=>{if(Q.items.some(i=>i.state==="run"||i.state==="queued")){e.preventDefault();e.returnValue=t("leave")}});
$("#fpick").addEventListener("change",e=>{enqueue([...e.target.files],S.path);e.target.value=""});
$("#dpick").addEventListener("change",e=>{enqueue([...e.target.files],S.path);e.target.value=""});

/* arrastrar y soltar, con carpetas */
let dragN=0;
const dropEl=$("#drop");
function dropText(){dropEl.innerHTML=`${svg("up")}${t("upload")}<span>${esc(S.path)}</span>`}
window.addEventListener("dragenter",e=>{if(!e.dataTransfer||![...e.dataTransfer.types].includes("Files")||$("#app").classList.contains("hide")||S.info.readonly||S.trash)return;dragN++;dropText();dropEl.classList.add("show")});
window.addEventListener("dragleave",()=>{if(--dragN<=0){dragN=0;dropEl.classList.remove("show")}});
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",async e=>{
 e.preventDefault();dragN=0;dropEl.classList.remove("show");
 if($("#app").classList.contains("hide")||S.info.readonly||S.trash)return;
 const dest=S.path,out=[];
 const entries=[...e.dataTransfer.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
 if(!entries.length){enqueue([...e.dataTransfer.files],dest);return}
 async function walk(en,pre){
  if(en.isFile){await new Promise(r=>en.file(f=>{f._rel=pre+f.name;out.push(f);r()},r))}
  else if(en.isDirectory){const rd=en.createReader();let batch;do{batch=await new Promise(r=>rd.readEntries(r,()=>r([])));for(const c of batch)await walk(c,pre+en.name+"/")}while(batch.length)}
 }
 for(const en of entries)await walk(en,"");
 enqueue(out,dest);
});

/* escanear el QR con la página ya abierta solo cambia el # */
window.addEventListener("hashchange",()=>{if(/k=[0-9a-f]+/.test(location.hash))boot()});

/* sigue viva la conexión: si vuelve, refresca */
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#app").classList.contains("hide"))refreshInfo()});

boot();
</script>
</body>
